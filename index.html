<!doctype html>
<html lang="en"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>AGENT HUB</title>
<meta name="apple-mobile-web-app-title" content="AGENT HUB">
<meta name="application-name" content="AGENT HUB">
<meta name="theme-color" content="#000007">
<link rel="apple-touch-icon" href="./apple-touch-icon.png">
<link rel="icon" type="image/png" sizes="32x32" href="./favicon-32.png">
<link rel="icon" href="./favicon.ico">
<link rel="manifest" href="./manifest.json">
<script>
(function(){
  var HUB="https://agent.enesmarealty.com/";
  var save=/[?&]save\b/.test(location.search);
  var standalone=navigator.standalone===true||(window.matchMedia&&matchMedia('(display-mode: standalone)').matches);
  if(standalone){location.replace(HUB);return;}
  window.__save=save;
  if(save){
    // Strip ?save so iOS stores the launcher URL (the redirecting launcher) as the home-screen start URL
    try{history.replaceState(null,"",location.pathname);}catch(e){}
  }else{
    setTimeout(function(){location.replace(HUB);},1500);
  }
})();
</script>
<style>
html,body{margin:0;height:100%;background:#000007;color:#EAD59E;font-family:-apple-system,BlinkMacSystemFont,"Helvetica Neue",Arial,sans-serif}
main{min-height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:24px;box-sizing:border-box}
img{width:96px;height:96px;border-radius:22px;margin-bottom:24px}
h1{font-size:15px;letter-spacing:.3em;font-weight:600;margin:0 0 8px;background:linear-gradient(#EAD59E,#D5BE87);-webkit-background-clip:text;background-clip:text;color:transparent}
p{color:#cfc6ae;font-size:15px;margin:6px 0;line-height:1.5}
.save{display:none}
body.is-save .save{display:block}body.is-save .go{display:none}
a.btn{display:inline-block;margin-top:24px;padding:14px 28px;border-radius:999px;background:linear-gradient(#EAD59E,#D5BE87);color:#000007;font-weight:600;text-decoration:none;letter-spacing:.05em}
</style>
</head><body>
<main>
<img src="./icon-192.png" alt="ENESMA Realty">
<h1>AGENT HUB</h1>
<div class="go"><p>Opening Agent Hub…</p></div>
<div class="save">
<p>Tap <strong>Share</strong>, then <strong>Add to Home Screen</strong></p>
<a class="btn" href="https://agent.enesmarealty.com/">Open Agent Hub</a>
</div>
</main>
<script>if(window.__save)document.body.className="is-save";</script>
</body></html>
