<!doctype html><html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>General Invoice – ENESMA</title><link rel="icon" href="../favicon-32.png">
<link rel="stylesheet" href="pdfjs/web/pdf_viewer.css">
<style>
:root{--black:#000007;--white:#FBFBFB;--gold:linear-gradient(135deg,#EAD59E,#D5BE87)}
*{box-sizing:border-box}html,body{margin:0;height:100%;background:var(--black);color:var(--white);font-family:-apple-system,system-ui,Segoe UI,Roboto,sans-serif}
header{position:fixed;top:0;left:0;right:0;height:60px;display:flex;align-items:center;gap:10px;padding:0 12px;padding-top:env(safe-area-inset-top);background:var(--black);z-index:10}
header::after{content:"";position:absolute;left:0;right:0;bottom:0;height:2px;background:var(--gold)}
header a.home img{height:38px;display:block}
h1{font-size:15px;font-weight:600;margin:0;flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;background:var(--gold);-webkit-background-clip:text;background-clip:text;color:transparent}
button{border:0;border-radius:8px;padding:9px 12px;font-weight:700;font-size:14px;cursor:pointer;background:var(--gold);color:var(--black)}
button.ghost{background:var(--black);color:var(--white);border:1px solid #D5BE87}
#viewerContainer{position:absolute;top:60px;bottom:0;left:0;right:0;overflow:auto;-webkit-overflow-scrolling:touch;background:var(--black)}
.pdfViewer .page{border:0;margin:8px auto;box-shadow:0 0 0 1px #D5BE87}
footer{position:fixed;bottom:0;right:0;font-size:11px;padding:4px 8px}footer a{color:var(--white)}
@media(max-width:480px){h1{font-size:13px}button{padding:8px 9px;font-size:13px}}
</style></head><body data-form="invoice">
<header><a class="home" href="https://agent.enesmarealty.com" target="_top" aria-label="Back to Agent Hub"><img src="../emblem-gold.png" alt="ENESMA"></a><h1>General Invoice</h1>
<button class="ghost" id="pr">Print</button><button id="dl">Download filled PDF</button></header>
<div id="viewerContainer"><div id="viewer" class="pdfViewer"></div></div>
<footer><a id="rawLink" href="invoice.pdf">Open raw PDF</a></footer>
<script type="module" src="viewer.js"></script></body></html>
