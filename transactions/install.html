<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<script>
(function(){var s=(window.navigator.standalone===true)||(window.matchMedia&&window.matchMedia('(display-mode: standalone)').matches);
if(s){location.replace('/transactions/');}})();
</script>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Transaction Center</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Transactions">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<meta name="theme-color" content="#000007">
<link rel="manifest" href="manifest.webmanifest?v=2">
<link rel="apple-touch-icon" sizes="180x180" href="assets/icons/apple-touch-icon.png?v=2">
<link rel="icon" type="image/png" sizes="32x32" href="assets/icons/favicon-32.png?v=2">
<link rel="icon" type="image/png" sizes="192x192" href="assets/icons/icon-192.png?v=2">
<style>
:root{--g:linear-gradient(135deg,#EAD59E 0%,#D5BE87 100%)}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;background:#000007;color:#FBFBFB;font-family:-apple-system,BlinkMacSystemFont,"Roboto","Helvetica Neue",Arial,sans-serif}
body{display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:120px 24px 140px}
.appicon{width:96px;height:96px;border-radius:22%;margin-bottom:28px;display:block;box-shadow:0 6px 24px rgba(0,0,0,.5)}
h1{font-size:26px;font-weight:700;letter-spacing:.02em;margin-bottom:14px;background:var(--g);-webkit-background-clip:text;background-clip:text;color:transparent}
p.ins{font-size:19px;line-height:1.5;max-width:330px}
.ic{display:inline-block;width:22px;height:26px;vertical-align:-5px;margin:0 3px}
.rule{width:120px;height:1px;background:var(--g);margin:26px auto}
a.cont{font-size:14px;color:#FBFBFB;opacity:.75;text-decoration:none;border-bottom:1px solid #D5BE87;padding-bottom:2px}
#install{display:none;margin:0 auto 22px;padding:12px 26px;border:0;border-radius:999px;background:var(--g);color:#000007;font-size:16px;font-weight:700;letter-spacing:.02em}
.arrow{position:fixed;width:44px;height:90px}
.ios .arrow{left:50%;bottom:calc(18px + env(safe-area-inset-bottom));margin-left:-22px;animation:down 1.4s ease-in-out infinite}
.android .arrow{right:14px;top:8px;transform:rotate(180deg);animation:up 1.4s ease-in-out infinite}
@keyframes down{0%,100%{transform:translateY(0)}50%{transform:translateY(14px)}}
@keyframes up{0%,100%{transform:rotate(180deg) translateY(0)}50%{transform:rotate(180deg) translateY(14px)}}
.ios .android-only,.android .ios-only{display:none}
@media (prefers-reduced-motion:reduce){.arrow{animation:none!important}}
</style>
</head>
<body>
<img class="appicon" src="assets/icons/icon-512.png?v=2" alt="Transaction Center app icon" width="96" height="96">
<h1>Transaction Center</h1>
<button id="install" type="button">Install Transaction Center</button>
<p class="ins ios-only">Tap Share
<svg class="ic" viewBox="0 0 22 26" aria-label="Share icon"><defs><linearGradient id="sg" gradientUnits="userSpaceOnUse" x1="0" y1="0" x2="22" y2="26"><stop offset="0" stop-color="#EAD59E"/><stop offset="1" stop-color="#D5BE87"/></linearGradient></defs><g fill="none" stroke="url(#sg)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M11 2v15"/><path d="M6 7l5-5 5 5"/><path d="M7 11H3v13h16V11h-4"/></g></svg>,
then Add to Home Screen</p>
<p class="ins android-only">Tap the menu
<svg class="ic" viewBox="0 0 22 26" aria-label="Three-dot menu icon"><defs><linearGradient id="mg" gradientUnits="userSpaceOnUse" x1="0" y1="0" x2="22" y2="26"><stop offset="0" stop-color="#EAD59E"/><stop offset="1" stop-color="#D5BE87"/></linearGradient></defs><g fill="url(#mg)"><circle cx="11" cy="5" r="2.4"/><circle cx="11" cy="13" r="2.4"/><circle cx="11" cy="21" r="2.4"/></g></svg>,
then Add to Home screen or Install app</p>
<div class="rule"></div>
<a class="cont" id="cont" href="/transactions/">Continue to Transaction Center</a>
<svg class="arrow" viewBox="0 0 44 90" aria-hidden="true"><defs><linearGradient id="ag" gradientUnits="userSpaceOnUse" x1="0" y1="0" x2="44" y2="90"><stop offset="0" stop-color="#EAD59E"/><stop offset="1" stop-color="#D5BE87"/></linearGradient></defs><g fill="none" stroke="url(#ag)" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"><path d="M22 4v78"/><path d="M6 66l16 16 16-16"/></g></svg>
<script>
var ua=navigator.userAgent,p=new URLSearchParams(location.search).get('p');
var isIOS=/iPhone|iPad|iPod/.test(ua)||(navigator.platform==='MacIntel'&&navigator.maxTouchPoints>1);
var plat=(p==='ios'||p==='android')?p:(/Android/i.test(ua)?'android':'ios');
document.body.className=plat;
if(isIOS){document.getElementById('cont').style.display='none';}
var dp;window.addEventListener('beforeinstallprompt',function(e){e.preventDefault();dp=e;document.getElementById('install').style.display='block';});
document.getElementById('install').addEventListener('click',function(){if(!dp)return;dp.prompt();dp.userChoice.finally(function(){dp=null;document.getElementById('install').style.display='none';});});
window.addEventListener('appinstalled',function(){document.getElementById('install').style.display='none';});
</script>
</body>
</html>
